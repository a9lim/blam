name: Release

# Triggered by the main push itself — crates.io trusted publishing
# rejects `workflow_run`-minted tokens (2026-08-08, measured: status
# 400, "does not support the workflow_run event trigger") — but the
# guard job's first step WAITS for the CI workflow on this exact SHA
# and fails unless it succeeded. Publication therefore still never
# outruns the verification bar — cargo publish alone compiles the
# package but runs none of the suite/spot-check/Lean gates.
on:
  push:
    branches: [main]

# Single in-flight release at a time. If two version bumps land back to
# back the second waits rather than racing to the same tag / version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate. Version comes from Cargo.toml; the git tag is the
  # completion marker, so the pipeline is dormant while main's version
  # is already tagged — bumping the version is what arms it. The
  # crates.io probe is independent of the tag so a partial-failure run
  # resumes cleanly: an already-published version skips straight to the
  # tag + GitHub release. Every checkout pins the exact SHA CI passed.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.state.outputs.should_release }}
      crates_published: ${{ steps.state.outputs.crates_published }}
      released: ${{ steps.state.outputs.released }}
    steps:
      - name: Wait for CI success on this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll the CI workflow's run for this SHA (REST, not `gh run
          # list -c`, so a runner gh version bump cannot break the gate).
          # Both workflows trigger on the same push, so the run record
          # may not exist yet on early polls ("null null" from jq on the
          # empty list — treated as still pending). CI takes ~3 minutes;
          # 120 * 30 s = 1 h ceiling.
          for i in $(seq 1 120); do
            resp="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
              -q '.workflow_runs[0] | "\(.status) \(.conclusion)"' 2>/dev/null || true)"
            status="${resp%% *}"
            conclusion="${resp##* }"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] && exit 0
              echo "CI concluded '$conclusion' on $GITHUB_SHA — refusing to release" >&2
              exit 1
            fi
            sleep 30
          done
          echo "CI never concluded for $GITHUB_SHA" >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Read version from Cargo.toml
        id: v
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve release state
        id: state
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
          crates_code="$(curl -s -o /dev/null -w '%{http_code}' -A 'blam-release-ci' "https://crates.io/api/v1/crates/blam/$VERSION")"
          if [ "$crates_code" = "200" ]; then
            echo "crates_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates_published=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # crates.io via trusted publishing: rust-lang/crates-io-auth-action
  # exchanges the workflow's OIDC identity for a short-lived registry
  # token, so there is no CARGO_REGISTRY_TOKEN secret to manage. cargo
  # publish rebuilds the package in isolation before upload; the
  # include allowlist means no submodule checkout is needed.
  crates-io:
    needs: guard
    if: needs.guard.outputs.should_release == 'true' && needs.guard.outputs.crates_published == 'false'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Mint a short-lived crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Tag + GitHub release with auto-generated notes. `!cancelled() &&
  # !failure()` lifts the implicit success-gate so this still runs when
  # crates-io was SKIPPED (already published on a prior attempt) — but
  # not when it FAILED. The crate lives on crates.io; nothing is
  # attached here.
  github-release:
    needs: [guard, crates-io]
    if: ${{ !cancelled() && !failure() && needs.guard.outputs.should_release == 'true' && needs.guard.outputs.released == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Tag and create the GitHub release
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" --generate-notes --verify-tag
