name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Release builds keep debug info for local profiling; CI needs none of it.
env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The published API's docs: a broken intra-doc link is a promise the
      # crate does not keep.
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    # --release because the certificate soundness battery is built for
    # release speed. tromp_vectors inlines its vectors, so no ref/AIT
    # checkout is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace --all-features
      # The engine must build with im-rc alone.
      - run: cargo check --lib --no-default-features

  default-features:
    # The census spot-check: fate columns, max|nf| and beta_total of rows
    # 4..32 must match data/classical/census_table.txt exactly (escal is
    # reported, not failed). It builds the default-feature binary, so the one
    # behaviour default features add, the no-lab dispatcher arms, is tested
    # here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/spot-check.sh 4 32
      - run: cargo test --release --bin blam lab_subcommands_are_named_either_way
