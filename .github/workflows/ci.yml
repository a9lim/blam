name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rustdoc:
    # The published API's own docs: a broken intra-doc link, or a public
    # item pointing at a private one, is a reader following a promise
    # that is not kept. 2.0.0 ships this surface, so the gate is hard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # rust-version in Cargo.toml is a promise to anyone who depends on
    # the crate; nothing enforces it but this job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  stale-invocations:
    # One binary, `blam`, with subcommands. Every predecessor bin name
    # (qcensus, certsearch, tracescan, …) is gone, so a script or doc
    # that still invokes one is a command that cannot run. Historical
    # prose under docs/ and ledger/ is exempt — that is the record of
    # what WAS — and so is the vendored ref/AIT.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no invocations of retired binaries
        run: |
          bins='census|qcensus|qradical|qcomplement|certsearch|certlean|certdiag|tracescan|slotsearch|oddminproto|solomonoff|adjudicate|normalize|selfint|qskeleton'
          hits=$(grep -rnE "target/(release|debug)/($bins)\b|--bin +($bins)\b" \
                   --exclude-dir=.git --exclude-dir=target --exclude-dir=ref \
                   --exclude-dir=docs --exclude-dir=ledger . || true)
          if [ -n "$hits" ]; then
            echo "stale invocations of retired binaries:"
            echo "$hits"
            exit 1
          fi

  test:
    # --release is the repo's own verification bar (AGENTS.md): the cert
    # battery pushes 196,848 provable halters through the sweep ladder and
    # is built for release speed. tromp_vectors inlines its vectors; the
    # ref/AIT checkout is for the uni.rs parity step (contrib/ait-uni).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-features so the `lab` surface (research instruments, the
      # untrusted certificate discovery layer, and the `blam` subcommands
      # built on them) is compiled and tested too.
      - run: cargo test --release --workspace --all-features
      # Default features: the no-lab dispatcher arms actually run.
      - run: cargo test --release
      # The engine must also build with im-rc alone.
      - run: cargo test --release --no-default-features
      - name: uni.rs parity (byte-identical vs uni.py on Tromp's corpus)
        run: bash contrib/ait-uni/verify.sh

  census-spot-check:
    # The standing regression guarantee: halt counts are bit-identical to
    # data/classical/census_table.txt under every engine change. Rows 4..32 cover the
    # full ladder including loop32's row and run in under a second locally;
    # timing columns are excluded, everything else must match exactly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/spot-check.sh 4 32

  lean:
    # Kernel-check all 297 divergence certificates (zero sorries, no
    # mathlib; ~2 s once the pinned toolchain is cached).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: lake build Certs
        working-directory: lean

  fork-additive:
    # The ref/AIT submodule is the a9lim/AIT fork: upstream tromp/AIT plus
    # additions only. The conformance goldens stay byte-identical to
    # upstream's — the moment the fork *modifies* an upstream file, the
    # oracle-vs-ours boundary is gone and this job fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: |
          cd ref/AIT
          git remote add upstream https://github.com/tromp/AIT.git
          git fetch -q upstream master
          viol=$(git diff --name-status upstream/master...HEAD | grep -v '^A' || true)
          if [ -n "$viol" ]; then
            echo "fork is not additive-only over upstream:"
            echo "$viol"
            exit 1
          fi
