version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # Only two runtime crates (im-rc, rayon), both load-bearing for the
  # engine's measured performance — bumps should arrive as PRs that run
  # the full bar (tests + census spot-check), never silently.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
