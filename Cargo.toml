[package]
name = "blam"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
description = "Binary lambda calculus engine for algorithmic information theory: exhaustive term censuses, busy-beaver frontiers, exact Solomonoff/Kolmogorov measurements"
license = "AGPL-3.0-or-later"
repository = "https://github.com/a9lim/blam"
readme = "README.md"
keywords = ["lambda-calculus", "busy-beaver", "kolmogorov", "solomonoff", "ait"]
categories = ["science", "mathematics", "algorithms"]
# The crate is the engine; measurement outputs, the Lean formalization,
# the analysis tools, and the ref/AIT submodule ship via the repo, not
# the package.
include = ["/src", "/examples", "/Cargo.toml", "/README.md", "/LICENSE"]

[features]
default = ["cli"]
# The `blam` driver binary. Owns the rayon dependency; the library
# engine itself needs only im-rc.
cli = ["dep:rayon"]
# Research instruments (`lab::*`), the untrusted certificate discovery
# surface (`classical::certificate::search`), and the `blam` subcommands
# built on them (cert search/diag, trace, slots, q galois, q oddmin).
lab = []

[dependencies]
im-rc = "15"
rayon = { version = "1", optional = true }

[dev-dependencies]
rayon = "1"

[profile.release]
debug = true

[[bin]]
name = "blam"
path = "src/cli/main.rs"
# The lab subcommands are cfg-gated inside the dispatcher, so the binary
# builds under default features and simply says how to get them.
required-features = ["cli"]
